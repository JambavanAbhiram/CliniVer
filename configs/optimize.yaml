# Optimization round 1 (owner request 2026-11-21), NB08 Part B, experiment EXP-08-002. Experiment parameters only.
# Written BEFORE running. The three weaknesses come from EXP-08-001:
#   - the verifier is the bottleneck;
#   - false support / numeric blindness;
#   - the confidence layer does not help end to end.
# Leakage protection: every candidate is trained and selected WITHOUT the test data below. SciFact dev / HealthVer
# test / HealthFC / synthetic were seen in NB06–NB08, so they are reported only as secondary ("seen").
snapshot: "2026-11-20"
seed: 42

splits:                               # SciFact TRAIN claims, split by claim (seeded); not used for retrieval tuning in NB05
  scifact_train_claims: {train: 0.5, dev: 0.2, test: 0.3}
  # train → verifier fine-tuning (with HealthVer train); dev → configuration selection; test → fresh end-to-end test

fresh_tests:
  scifact_train_test: "the 30% held-out SciFact train claims, end to end (retrieval over the NB05 primary corpus; same claim filter as NB08)"
  pubhealth:
    repo: ImperialCollegeLondon/health_fact
    revision: 7f898a16838e708a4597986e3fab8af05b710ba4     # refs/convert/parquet (data-only conversion of the original release)
    file: default/test/0000.parquet
    license: MIT (github.com/neemakot/Health-Fact-Checking LICENSE)  # evaluation only here; IDs only redistributed
    label_map: {2: SUP, 0: CON, 3: INS}                    # true / false / unproven; mixture (1) and invalid (-1) excluded
    evidence_field: explanation                            # journalist-written justification (verifier-level test with given evidence)

verifiers:                            # same base model, recipe and hyper-parameters as ADR-0013 (configs/verification.yaml finetune)
  v1r: "v1 recipe retrained on HealthVer train + SciFact train-split pairs (clean baseline: has not seen the test claims)"
  v2: "v1r data + augmentation"
augmentation:
  perturbations: {negation: CON, number: CON, hedge: INS, population: INS, paraphrase: SUP}   # applied to training SUP pairs; one applicable edit per pair, chosen at random
  perturb_fraction: 0.5               # fraction of training SUP pairs that receive one perturbation
  hard_negatives_per_claim: 2         # top re-ranked abstracts that are neither cited nor evidence for a train-split claim → INS
  hard_negative_depth: 5

search_space:                         # evaluated on the dev split only
  verifier: [v1r, v2]
  numeric_guard: [false, true]        # SUP with a claim number absent from the evidence → INS
  ins_threshold_quantile: [null, 0.1, 0.2, 0.3]    # top-1 cross-encoder score below this dev quantile → INS
  second_opinion: [none, abstain, llm_label]       # below the 25th-percentile confidence: none / ABSTAINED on disagreement (v1 policy) / take the LLM label
baseline: {verifier: v1r, numeric_guard: false, ins_threshold_quantile: null, second_opinion: abstain}   # the approved v1 pipeline (ADR-0015), clean retrain

n_boot: 2000
decision_rules:
  selection: "on the dev split: highest END-TO-END macro-F1 (abstained = error) among configurations with false-support rate (answered) ≤ the baseline's dev FSR; ties within 0.01 → fewer components"
  adoption: "the selected configuration becomes baseline v2 if, on the fresh SciFact test split, its end-to-end macro-F1 − the baseline's > 0 (paired bootstrap point estimate; 95% CI reported) AND its FSR ≤ baseline FSR + 0.02, AND its PUBHEALTH macro-F1 is not lower than the baseline's by more than 0.02"
  policy_change: "verify the standalone rewrite (evidence: EXP-08-001 context ablation); reported with the selected verifier on the NB04 context items (seen)"
