# CliniVer — data acquisition configuration (Notebook 01). See ADR-0001 (domain) and ADR-0002 (sources).
# Rate limits are set at or below each provider's published or recommended policy (verified 2026-11-19).

snapshot: "2026-11-20"          # acquisition snapshot id (YYYY-MM-DD of the fetch); appears in every raw/normalized path

stage: B                        # A = controlled sample (done, EXP-01-001); B = full corpus (EXP-01-003)

# Stage B parameters. Decisions D-NB01-1…8 (NB01 §11), adopted 2026-11-20 under the owner's delegation.
stage_b:
  pubmed_years: [1990, 2026]    # D-NB01-1: full population, retrieved one publication year at a time
  openfda_rx_only: true         # D-NB01-3: prescription labels only
  openfda_max_labels_per_drug: 1000  # all Rx labels (largest total seen: 555, hydrochlorothiazide), paged by 100
  near_dup_threshold: 0.8       # D-NB01-3/7: Jaccard on word 5-shingles (MinHash/LSH + exact check)
  near_dup_min_words: 50        # very short texts give unstable Jaccard; excluded from PubMed near-dup check
  clinicaltrials_page_size: 200 # D-NB01-4: all completed drug trials (paged)
  europepmc_year_strata: [[2000, 2009], [2010, 2014], [2015, 2019], [2020, 2026]]   # D-NB01-5
  europepmc_per_stratum: 20     # 5 conditions × 4 strata × 20 = up to 400 long documents
  exclude_retracted: true       # safety rule: retracted publications never enter the evidence corpus

# Concurrency. Different providers run in parallel (independent rate limits). Within one provider,
# up to `workers_per_source` requests can be in flight, but request STARTS are still spaced by that
# source's min_interval_s, so no provider's published limit is exceeded.
concurrency:
  sources_in_parallel: 6
  workers_per_source: 4

# --- Domain conditions -------------------------------------------------------------
# PubMed query = condition clause AND common_filter. MeSH "/drug therapy" restricts to
# pharmacotherapy literature, the scope of ADR-0001.
pubmed:
  base_url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils
  min_interval_s: 0.5           # 2 req/s. NCBI keyless limit is 3 req/s, counted by ARRIVAL time. At 0.4 s
                                # with parallel in-flight requests, jitter produced 14 HTTP 429s (EXP-01-001).
  max_in_flight: 2              # overrides concurrency.workers_per_source for this provider
  efetch_batch: 200
  tool: cliniver                # NCBI-encouraged identification; email only if set in .env (NCBI_EMAIL)
  common_filter: >-
    AND humans[MeSH Terms] AND english[Language] AND hasabstract
    AND ("1990/01/01"[Date - Publication] : "3000"[Date - Publication])
  conditions:
    t2d: '"Diabetes Mellitus, Type 2/drug therapy"[MeSH Terms]'
    hypertension: '"Hypertension/drug therapy"[MeSH Terms]'
    dyslipidaemia: '"Dyslipidemias/drug therapy"[MeSH Terms]'
    af_anticoagulation: '("Atrial Fibrillation/drug therapy"[MeSH Terms] OR ("Atrial Fibrillation"[MeSH Terms] AND "Anticoagulants"[MeSH Terms]))'
    heart_failure: '"Heart Failure/drug therapy"[MeSH Terms]'
  # Count-only queries (no records downloaded) estimate the full population by type and decade.
  publication_type_strata:
    meta_analysis: Meta-Analysis[Publication Type]
    systematic_review: Systematic Review[Publication Type]
    rct: Randomized Controlled Trial[Publication Type]
    clinical_trial_other: (Clinical Trial[Publication Type] NOT Randomized Controlled Trial[Publication Type])
    observational: Observational Study[Publication Type]
    review: (Review[Publication Type] NOT Systematic Review[Publication Type])
    guideline: (Practice Guideline[Publication Type] OR Guideline[Publication Type])
    case_report: Case Reports[Publication Type]
  decades: [[1990, 1999], [2000, 2009], [2010, 2019], [2020, 2026]]
  sample_per_condition: 100     # Stage A
  sample_sort: relevance        # "Best Match"; sample bias documented in NB01

# --- Drugs in scope (generic names; used for openFDA, RxNorm, PubChem, ClinicalTrials) ---
drugs:
  t2d: [metformin, empagliflozin, dapagliflozin, canagliflozin, semaglutide, liraglutide, dulaglutide,
        tirzepatide, sitagliptin, linagliptin, glimepiride, glipizide, pioglitazone, insulin glargine]
  hypertension: [lisinopril, enalapril, ramipril, losartan, valsartan, candesartan, amlodipine, nifedipine,
                 hydrochlorothiazide, chlorthalidone, indapamide, metoprolol, bisoprolol, carvedilol]
  dyslipidaemia: [atorvastatin, rosuvastatin, simvastatin, pravastatin, ezetimibe, evolocumab, alirocumab]
  af_anticoagulation: [warfarin, apixaban, rivaroxaban, dabigatran, edoxaban, aspirin, clopidogrel]
  heart_failure: [sacubitril, spironolactone, eplerenone, furosemide, torsemide, ivabradine, digoxin]

openfda:
  base_url: https://api.fda.gov/drug/label.json
  min_interval_s: 0.5           # keyless: ~1,000 requests/day/IP; we stay far below
  labels_per_drug: 3            # Stage A: >1 to measure near-duplicate labels across manufacturers
  sample_drugs_per_condition: 2
  sections:                     # SPL sections kept as evidence text
    - indications_and_usage
    - dosage_and_administration
    - dosage_forms_and_strengths
    - contraindications
    - warnings_and_cautions
    - warnings
    - boxed_warning
    - adverse_reactions
    - drug_interactions
    - use_in_specific_populations
    - pregnancy
    - pediatric_use
    - geriatric_use
    - clinical_pharmacology
    - mechanism_of_action
    - clinical_studies

clinicaltrials:
  base_url: https://clinicaltrials.gov/api/v2/studies
  min_interval_s: 1.3           # ~46 req/min; no official limit published, ~50/min commonly reported
  sample_per_condition: 20
  conditions:
    t2d: Type 2 Diabetes
    hypertension: Hypertension
    dyslipidaemia: Dyslipidemia
    af_anticoagulation: Atrial Fibrillation
    heart_failure: Heart Failure
  intervention_type: DRUG

pubtator:
  base_url: https://www.ncbi.nlm.nih.gov/research/pubtator3-api
  min_interval_s: 0.5           # NCBI service; same arrival-jitter margin as E-utilities (EXP-01-002)
  max_in_flight: 2
  batch: 100

rxnav:
  base_url: https://rxnav.nlm.nih.gov/REST
  min_interval_s: 0.1           # NLM: up to 20 req/s per IP
  class_sources: [ATC, FDASPL]  # FDASPL gives EPC / mechanism / chemical classes

pubchem:
  base_url: https://pubchem.ncbi.nlm.nih.gov/rest/pug
  min_interval_s: 0.25          # PubChem: no more than 5 req/s
  max_synonyms: 25

europepmc:
  base_url: https://www.ebi.ac.uk/europepmc/webservices/rest
  min_interval_s: 0.2
  # Only licenses that permit text mining and research reuse.
  licenses: ["cc by", "cc0", "cc by-sa", "cc by-nc", "cc by-nc-sa", "cc by-nd", "cc by-nc-nd"]
  sample_per_condition: 2
  condition_queries:
    t2d: '"type 2 diabetes" AND (metformin OR "SGLT2" OR "GLP-1")'
    hypertension: 'hypertension AND (antihypertensive OR "ACE inhibitor" OR "angiotensin receptor blocker")'
    dyslipidaemia: '(dyslipidemia OR hypercholesterolemia) AND (statin OR ezetimibe OR PCSK9)'
    af_anticoagulation: '"atrial fibrillation" AND (anticoagulant OR apixaban OR warfarin)'
    heart_failure: '"heart failure" AND (sacubitril OR "SGLT2" OR spironolactone OR "beta-blocker")'

who_gho:
  base_url: https://ghoapi.azureedge.net/api   # legacy OData endpoint; live as of 2026-11-19 (rework announced)
  min_interval_s: 0.5
  indicator_keywords: ["raised blood pressure", "raised fasting blood glucose", "diabetes", "raised total cholesterol"]
  spatial_types: [GLOBAL, REGION]
