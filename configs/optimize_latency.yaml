# Optimization round 1, latency part (owner request 2026-11-22: "include latency in the optimization list").
# NB08 Part C, experiment EXP-08-003. Written BEFORE any latency measurement and before the EXP-08-002 results were seen.
#
# Baseline latency (EXP-08-001, RTX 5070 Laptop):
#   - claim extraction 18.8 s per answer (dominant);
#   - rewrite 0.88 s per context-dependent claim;
#   - retrieval p95 0.37 s per claim (re-rank ≈ 241 ms);
#   - second opinion 2.33 s per routed claim;
#   - demo: + ~3 s per LLM-server start.
# Principle: a latency change is adopted only if quality is non-inferior. Changes that cannot alter outputs are
# verified to leave the outputs identical.
snapshot: "2026-11-20"
seed: 42

dev_answers: 40                       # NB03 answers (both generators), seeded sample, for the extraction timings
dev_claims: dev                       # SciFact-train dev split (EXP-08-002) for the retrieval / second-opinion levers
test_claims: test                     # SciFact-train test split, reported after selection

levers:
  L1_speculative_decoding:
    what: "Qwen3-0.6B (Q8_0) as draft model for Qwen3-8B in llama-server (--model-draft); greedy decoding, JSON-schema constrained"
    draft_model: qwen3-0.6b
    draft_max: [8, 16]
    ngram_variant: "--spec-type ngram-simple (no draft model, no extra GPU memory; extraction copies spans of the answer). Added 2026-11-22 before any latency measurement"
    quality_check: "extraction outputs on the dev answers: share byte-identical to the baseline output; if not identical, claim-level F1 vs the baseline claims (NLI judge, as NB03) ≥ 0.98"
    vram_check: "peak GPU memory of the server ≤ 6.0 GB budget"
  L2_rerank_pool:
    what: "cross-encoder re-rank pool size"
    values: [50, 30, 20]
    quality_check: "end-to-end macro-F1 on the dev split with the selected EXP-08-002 configuration: Δ ≥ −0.01 vs pool 50"
  L3_batched_retrieval:
    what: "one BM25 / dense / cross-encoder call for all claims of an answer instead of one per claim"
    quality_check: "retrieved rankings identical (up to fp16 tie order) to per-claim retrieval"
  L4_warm_server:
    what: "demo: keep the LLM server running between requests; the PyTorch models stay on the GPU if the total peak ≤ 6.0 GB, otherwise the unit embeddings are searched on the CPU"
    quality_check: "outputs identical (same models, same inputs)"
  L5_second_opinion_tokens:
    what: "second-opinion max_tokens 300 → 160 (shorter rationale)"
    quality_check: "label agreement with the 300-token run on the routed dev pairs ≥ 0.98"

decision_rules:
  adoption: "a lever is adopted if its quality check passes AND it reduces the median latency of its stage by ≥ 10% on the dev set; the final per-answer latency (median, p95) is reported on the test answers / claims with all adopted levers"
  reporting: "every latency figure is measured on this laptop and logged with the hardware record; no estimated figure is reported as measured"
